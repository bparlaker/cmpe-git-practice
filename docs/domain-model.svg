<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 492" role="img" aria-label="A craft entry fills in the fields its craft type defines" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="dm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">A craft entry fills in the fields its craft type defines</text><text x="24" y="50" font-size="11.5" fill="#59636e">Category tree on top, entry data below; arrows read as the label says</text><g fill="none" stroke="#8c959f" stroke-width="1.25"><path d="M244 120H270" marker-end="url(#dm-arrow)"></path><path d="M490 120H516" marker-end="url(#dm-arrow)"></path><path d="M660 156V200" marker-end="url(#dm-arrow)"></path><path d="M380 200V176H560V156" marker-end="url(#dm-arrow)"></path><path d="M380 336V380" marker-end="url(#dm-arrow)"></path><path d="M490 424H660V336" marker-end="url(#dm-arrow)"></path><path d="M244 236H270" marker-end="url(#dm-arrow)"></path><path d="M244 316H270" marker-end="url(#dm-arrow)"></path></g><text x="257" y="76" text-anchor="middle" font-size="11.5" fill="#59636e">contains</text><text x="503" y="76" text-anchor="middle" font-size="11.5" fill="#59636e">contains</text><text x="668" y="184" font-size="11.5" fill="#59636e">defines</text><text x="470" y="170" text-anchor="middle" font-size="11.5" fill="#59636e">is of type</text><text x="388" y="362" font-size="11.5" fill="#59636e">has values</text><text x="575" y="416" text-anchor="middle" font-size="11.5" fill="#59636e">fills</text><g><rect x="24" y="84" width="220" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="36" y="108" font-weight="600" fill="#1f2328">Category, level 1</text><text x="36" y="126" font-size="11.5" fill="#59636e">e.g. Textile Arts</text><text x="36" y="142" font-size="11.5" fill="#59636e">managed by the admin</text></g><g><rect x="270" y="84" width="220" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="282" y="108" font-weight="600" fill="#1f2328">Category, level 2</text><text x="282" y="126" font-size="11.5" fill="#59636e">e.g. Flat-woven Rugs</text><text x="282" y="142" font-size="11.5" fill="#59636e">managed by the admin</text></g><g><rect x="516" y="84" width="220" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="528" y="108" font-weight="600" fill="#1f2328">CraftType (level 3)</text><text x="528" y="126" font-size="11.5" fill="#59636e">e.g. Kilim, Cicim, Zili</text><text x="528" y="142" font-size="11.5" fill="#59636e">predefined or user-defined</text></g><g><rect x="516" y="200" width="220" height="136" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="528" y="224" font-weight="600" fill="#1f2328">AttributeDefinition</text><text x="528" y="242" font-size="11.5" fill="#59636e">name, data type, required</text><text x="528" y="258" font-size="11.5" fill="#59636e">unit: mm, cm, m, g, kg</text><text x="528" y="274" font-size="11.5" fill="#59636e">allowed values for choices</text><text x="528" y="290" font-size="11.5" fill="#59636e">Kilim: Width (cm)</text><text x="528" y="306" font-size="11.5" fill="#59636e">Kilim: Colors (multiple)</text><text x="528" y="322" font-size="11.5" fill="#59636e">Kilim: Production place (pin)</text></g><g><rect x="270" y="200" width="220" height="136" rx="8" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="2"></rect><text x="282" y="224" font-weight="600" fill="#1f2328">CraftEntry</text><text x="282" y="242" font-size="11.5" fill="#1f2328">title, owner, images</text><text x="282" y="258" font-size="11.5" fill="#1f2328">one craft type (level 3)</text><text x="282" y="274" font-size="11.5" fill="#1f2328">production place: map pin</text><text x="282" y="290" font-size="11.5" fill="#1f2328">only its type&#x27;s fields</text><text x="282" y="306" font-size="11.5" fill="#1f2328">no extra fields allowed</text><text x="282" y="322" font-size="11.5" fill="#1f2328">personal story: only free text</text></g><g><rect x="270" y="380" width="220" height="88" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="282" y="404" font-weight="600" fill="#1f2328">AttributeValue</text><text x="282" y="422" font-size="11.5" fill="#59636e">one value per attribute</text><text x="282" y="438" font-size="11.5" fill="#59636e">number + unit, or chosen values</text><text x="282" y="454" font-size="11.5" fill="#59636e">e.g. Width = 120 cm</text></g><g><rect x="24" y="200" width="220" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="36" y="224" font-weight="600" fill="#1f2328">Tag (many per entry)</text><text x="36" y="242" font-size="11.5" fill="#59636e">predefined or added by users</text><text x="36" y="258" font-size="11.5" fill="#59636e">suggestions, spelling help</text></g><g><rect x="24" y="280" width="220" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="36" y="304" font-weight="600" fill="#1f2328">Color, Pattern (many)</text><text x="36" y="322" font-size="11.5" fill="#59636e">colors from a fixed palette</text><text x="36" y="338" font-size="11.5" fill="#59636e">patterns listed per craft type</text></g></svg>
