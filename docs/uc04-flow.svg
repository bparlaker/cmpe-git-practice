<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 980" role="img" aria-label="Choosing the craft type decides which fields the user fills" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="fl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Choosing the craft type decides which fields the user fills</text><text x="24" y="50" font-size="11.5" fill="#59636e">UC-04 Add a craft entry, with a kilim as the example</text><g fill="none" stroke="#8c959f" stroke-width="1.25"><path d="M300 120V148" marker-end="url(#fl-arrow)"></path><path d="M300 204V228" marker-end="url(#fl-arrow)"></path><path d="M300 284V308" marker-end="url(#fl-arrow)"></path><path d="M300 364V392" marker-end="url(#fl-arrow)"></path><path d="M300 456V484" marker-end="url(#fl-arrow)"></path><path d="M300 540V564" marker-end="url(#fl-arrow)"></path><path d="M300 620V644" marker-end="url(#fl-arrow)"></path><path d="M300 700V724" marker-end="url(#fl-arrow)"></path><path d="M300 780V808" marker-end="url(#fl-arrow)"></path><path d="M300 872V900" marker-end="url(#fl-arrow)"></path><path d="M390 424H520" marker-end="url(#fl-arrow)"></path><path d="M620 396V336H450" marker-end="url(#fl-arrow)"></path><path d="M210 840H120V592H150" marker-end="url(#fl-arrow)"></path></g><g><rect x="150" y="64" width="300" height="56" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="162" y="86" font-weight="600" fill="#1f2328">Pre: the user is logged in</text><text x="162" y="104" font-size="11.5" fill="#59636e">at least one craft type exists</text></g><g><rect x="150" y="148" width="300" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="162" y="170" font-weight="600" fill="#1f2328">1. Choose a domain</text><text x="162" y="188" font-size="11.5" fill="#59636e">level 1, e.g. Textile Arts</text></g><g><rect x="150" y="228" width="300" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="162" y="250" font-weight="600" fill="#1f2328">2. Choose a family</text><text x="162" y="268" font-size="11.5" fill="#59636e">level 2, e.g. Flat-woven Rugs</text></g><g><rect x="150" y="308" width="300" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="162" y="330" font-weight="600" fill="#1f2328">3. Choose a craft type</text><text x="162" y="348" font-size="11.5" fill="#59636e">level 3, e.g. Kilim</text></g><g><polygon points="210,424 300,392 390,424 300,456" fill="none" stroke="#8c959f" stroke-width="1.25"></polygon><text x="300" y="428" text-anchor="middle" fill="#1f2328">Type in the list?</text></g><g><rect x="520" y="396" width="200" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="532" y="418" font-weight="600" fill="#1f2328">UC-07 Define a type</text><text x="532" y="436" font-size="11.5" fill="#59636e">name, family, fields, units</text></g><g><rect x="150" y="484" width="300" height="56" rx="8" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="2"></rect><text x="162" y="506" font-weight="600" fill="#1f2328">4. Form shows Kilim&#x27;s fields only</text><text x="162" y="524" font-size="11.5" fill="#1f2328">no extra fields can be added</text></g><g><rect x="150" y="564" width="300" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="162" y="586" font-weight="600" fill="#1f2328">5. Fill the fields</text><text x="162" y="604" font-size="11.5" fill="#59636e">width 120 cm, red and indigo, elibelinde</text></g><g><rect x="150" y="644" width="300" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="162" y="666" font-weight="600" fill="#1f2328">6. Pin the production place</text><text x="162" y="684" font-size="11.5" fill="#59636e">map pin near Kayseri</text></g><g><rect x="150" y="724" width="300" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="162" y="746" font-weight="600" fill="#1f2328">7. Add tags, images, story</text><text x="162" y="764" font-size="11.5" fill="#59636e">tags via UC-08; story is the only free text</text></g><g><polygon points="210,840 300,808 390,840 300,872" fill="none" stroke="#8c959f" stroke-width="1.25"></polygon><text x="300" y="844" text-anchor="middle" fill="#1f2328">Required fields valid?</text></g><g><rect x="150" y="900" width="300" height="56" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"></rect><text x="162" y="922" font-weight="600" fill="#1f2328">Post: the entry is saved</text><text x="162" y="940" font-size="11.5" fill="#59636e">visible to everyone and shown on the map</text></g><text x="308" y="476" font-size="11.5" fill="#59636e">yes</text><text x="455" y="416" text-anchor="middle" font-size="11.5" fill="#59636e">no</text><text x="535" y="328" text-anchor="middle" font-size="11.5" fill="#59636e">then pick it</text><text x="308" y="892" font-size="11.5" fill="#59636e">yes</text><text x="165" y="832" text-anchor="middle" font-size="11.5" fill="#59636e">no</text><text x="112" y="720" text-anchor="end" font-size="11.5" fill="#59636e">fix and retry</text></svg>
