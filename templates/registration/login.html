{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h3 mb-3">Log in</h1>
    {% if form.errors %}
      <div class="alert alert-danger">Wrong username or password. Please try again.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Username</label>
        <input class="form-control" type="text" name="username" id="id_username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Password</label>
        <input class="form-control" type="password" name="password" id="id_password" required>
      </div>
      {# After login I send the user back to the page they wanted. #}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
    <p class="mt-3">No account yet? <a href="{% url 'signup' %}">Sign up</a></p>
  </div>
</div>
{% endblock %}
